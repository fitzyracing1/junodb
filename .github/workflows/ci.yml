name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Select packages buildable without RocksDB
        # storageserv/dbscanserv/tools depend on third_party/forked/tecbot/gorocksdb, which needs a
        # locally built RocksDB (cgo) via the repo's build scripts; those packages are excluded here.
        run: go list -e -f '{{if not .Error}}{{if not .DepsErrors}}{{.ImportPath}} {{join .Deps " "}}{{end}}{{end}}' ./... | grep -v -e gorocksdb -e '/third_party/' | cut -d' ' -f1 > pkgs.txt && wc -l pkgs.txt
      - name: Build
        run: go build $(cat pkgs.txt)
      - name: Vet
        run: go vet $(cat pkgs.txt)

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        # storageserv needs a locally built RocksDB (cgo, third_party/forked gorocksdb) - excluded here
        run: go build $(go list -e ./... | grep -v -e /cmd/storageserv -e /third_party/)
      - name: Vet
        run: go vet $(go list -e ./... | grep -v -e /cmd/storageserv -e /third_party/)
